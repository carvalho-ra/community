{% extends "base.html" %}
{% block body %}
    <div class="container mt-3">
        <h1 style="color: orange">Community</h1>
        <hr>
        {% for post in posts %}
            <div class="row boder mt-4 p-3 mypost rounded">
                <div class="col-2">
                    <div class="image pe-2 mt-2"> <img src="{{ url_for('static', filename='profile_imgs/{}'.format(post.author.profile_img)) }}" class="rounded" width="145"> </div>
                    <strong>{{ post.author.username }}</strong>
                    <div class="row justify-content-center">
                        {% for course in post.author.cursos.split(';') %}
                            <button type="button" class="btn btn-success mt-2" disabled>{{ course }}</button>
                        {% endfor %}
                    </div>
                </div>
                <div class="col-9">
                    <a style="text-decoration: none" href="{{ url_for('view_post', post_id=post.id)}}"><h3>{{ post.title }}</h3></a>
                    <p>{{ post.body }}</p>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
